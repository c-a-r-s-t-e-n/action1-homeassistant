name: Bug report
description: Report an Action1 Monitor problem without exposing your tenant data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. This integration is read-only and independently maintained.
        **Never attach secrets, OAuth tokens, unredacted API responses, endpoint names, user names, serial numbers, IP addresses or Home Assistant storage files.**
  - type: input
    id: integration_version
    attributes:
      label: Action1 Monitor version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.2"
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Action1 cloud region
      options:
        - Europe
        - North America
        - North America 2
        - Australia
        - United Kingdom
        - Other / unknown
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Affected feature
      options:
        - Installation / authentication
        - Endpoints / connectivity
        - Missing updates / patch counts
        - CVE severity / KEV
        - Licensing and usage
        - Software / automations / reports
        - Branding / Marketplace
        - Performance / API throttling
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen without identifying your endpoints.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction
      description: Share steps, status category, and sanitized errors only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed API credentials, bearer tokens, organization/endpoint IDs, names, addresses and raw account exports.
          required: true
