name: Publish alpha prerelease
on:
  push:
    paths:
      - custom_components/action1_monitor/manifest.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install test dependencies
        run: python -m pip install 'aiohttp>=3.9,<4'
      - name: Verify Python source and tests
        run: |
          python -m compileall -q custom_components tests
          python -m unittest discover -s tests -v
      - name: Validate Home Assistant metadata
        uses: home-assistant/actions/hassfest@master
      - name: Verify alpha tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json;print(json.load(open("custom_components/action1_monitor/manifest.json"))["version"])')
          [[ "$VERSION" == *-alpha.* ]]
          test -f custom_components/action1_monitor/brand/icon.png
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag exists"; exit 1
          fi
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease --title "Action1 Monitor v$VERSION (Alpha)" --notes "Public experimental alpha: cloud OAuth, endpoint discovery, device sensors, update/CVE summary reports, automation/inventory counts, German/English setup, CI tests. No real Home Assistant runtime validation yet. Read-only API; never use as sole source for critical security decisions. See README and CHANGELOG for supported data and known limitations."
