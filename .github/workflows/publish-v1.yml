name: Publish stable v1
on:
  push:
    paths:
      - custom_components/action1_monitor/manifest.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install QA dependencies
        run: pip install 'aiohttp>=3.9,<4' 'ruff>=0.9,<1' 'Pillow>=11,<13'
      - name: Python, lint, regression suite and branding
        run: |
          python -m compileall -q custom_components tests scripts
          ruff check custom_components tests --select E4,E7,E9,F
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          brand=Path("custom_components/action1_monitor/brand")
          for prefix in ("", "dark_"):
              for fname,dimensions in (("icon.png",(256,256)),("icon@2x.png",(512,512)),("logo.png",(1000,256)),("logo@2x.png",(2000,512))):
                  img=Image.open(brand/(prefix+fname))
                  img.verify()
                  assert Image.open(brand/(prefix+fname)).size == dimensions
          assert Image.open("docs/assets/header.png").size == (1600,480)
          PY
      - name: Validate Home Assistant metadata
        uses: home-assistant/actions/hassfest@master
      - name: Validate HACS and Marketplace repository
        uses: hacs/action@main
        with:
          category: integration
      - name: Verify release metadata and create package
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          manifest = json.loads(pathlib.Path("custom_components/action1_monitor/manifest.json").read_text())
          assert manifest["version"] == "1.0.0"
          root=pathlib.Path("custom_components/action1_monitor")
          with zipfile.ZipFile("action1_monitor.zip","w",zipfile.ZIP_DEFLATED) as archive:
              for file in root.rglob("*"):
                  if file.is_file() and "__pycache__" not in file.parts:
                      archive.write(file, file.relative_to(root))
          PY
      - name: Publish v1.0.0 stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 && { echo "Release already exists"; exit 1; }
          gh release create v1.0.0 --target "$GITHUB_SHA" --latest --title "Action1 Monitor v1.0.0" --notes-file RELEASE_NOTES.md action1_monitor.zip
