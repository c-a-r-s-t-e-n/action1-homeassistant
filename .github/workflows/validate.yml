name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test and lint dependencies
        run: python -m pip install 'aiohttp>=3.9,<4' 'ruff>=0.9,<1'
      - name: Python syntax, lint and unit tests
        run: |
          python -m compileall -q custom_components tests scripts
          ruff check custom_components tests --select E4,E7,E9,F
          python -m unittest discover -s tests -v
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
